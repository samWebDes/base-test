# CI for a CMS COE site. Mirrors the local Stage D checks.
name: ci
on: [push, pull_request]
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', tools: composer }
      - run: composer install --no-interaction --no-progress
      # Composer-managed plugins (shared cmscoe-* packages included) must match composer.lock exactly:
      # a fresh install overwrites them, so any local edit or stray file shows up here as a diff.
      - name: Shared packages are not forked
        run: |
          changes=$(git status --porcelain -- wp-content/plugins)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::Composer-managed plugins differ from composer.lock. Change shared packages in the starter kit and release a new version."
            exit 1
          fi
      - run: composer lint
      - run: vendor/bin/phpcs
      - run: composer audit
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run build && git diff --exit-code wp-content/themes
      - run: npm audit --omit=dev
  # Integration (roles-test.php, smoke.sh, a11y.mjs) needs a running WordPress: run via ddev in a
  # self-hosted runner or the ddev/github-action-setup-ddev action. Outstanding.
